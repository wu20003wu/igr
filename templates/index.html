<!DOCTYPE html>
<html>
<head>
  <title>Routen-Highlight bei Klick</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin: 12px 20px; font-size: 14px;">
    <a href="{{ url_for('main.igs_page') }}" 
       style="color: #0074D9; text-decoration: none;">IGS</a>
    {% if is_admin %}
      <span style="color: #0074D9; font-weight: 600;">Admin</span>
      <a href="{{ url_for('admin.admin_dashboard') }}"
         style="color: #0074D9; text-decoration: none;">Dashboard</a>
      <a href="{{ url_for('admin.admin_logout') }}"
         style="color: #0074D9; text-decoration: none;">Logout</a>
    {% else %}
      <a href="{{ url_for('admin.admin_login') }}"
         style="color: #0074D9; text-decoration: none;">Admin Login</a>
    {% endif %}
  </div>
  <div style="display: flex; justify-content: center; align-items: flex-start; gap: 20px; margin: 20px;">
    <!-- Statistik-Panel -->
    <!--
    <div id="statsPanel" style="width: 200px; border: 1px solid #ccc; padding: 10px;">
      <div style="margin-bottom: 10px;">
        <input type="datetime-local" id="startTime" step="1" style="width: 100%;">
      </div>
      <button id="monitorButton" onclick="toggleMonitoring()" style="width: 100%;">Monitoring starten</button>
      <div id="stats" style="margin-top: 10px; font-size: 12px;"></div>
    </div>
    -->

    <!-- Cytoscape Diagramm -->
    <div id="cy" style="width: 100vw; height: 100vh; border: 1px solid #ccc; position: relative;">
      <button id="recenterBtn" title="Zentrieren und zoomen" 
              style="position: absolute; right: 20px; top: 20px; z-index: 1000;">
        <svg width="24" height="24" viewBox="0 0 24 24" style="vertical-align: middle;">
          <path fill="currentColor" d="M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4Z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Füge nach dem cy div und vor der Tabelle ein -->
  <div id="messageContainer" class="content-container">
    <form id="messageForm" class="message-form">
      <div style="margin-bottom: 15px;">
        <label for="message" style="display: block; margin-bottom: 5px; font-weight: bold;">Message:</label>
        <input type="text" id="message" name="message" 
               style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"
               placeholder="Gib deine Nachricht ein..."
               required>
      </div>
      <!-- Neuer Clear-Button -->
      <div style="display: flex; justify-content: flex-end; margin-top: -10px; margin-bottom: 15px;">
        <button type="button" onclick="clearInput()"
                {% if not is_admin %}disabled{% endif %}
                style="padding: 6px 12px; background: {% if is_admin %}#0074D9{% else %}#a0a0a0{% endif %}; color: white; border: none; border-radius: 4px; cursor: {% if is_admin %}pointer{% else %}not-allowed{% endif %}; transition: background 0.3s ease;{% if not is_admin %} opacity: 0.6;{% endif %}">
          Clear
        </button>
      </div>
    </form>
  </div>

  <!-- Add after the cytoscape div -->
  <div id="rulesTable" class="content-container">
    <h3>Routing Rules Table</h3>
    <table border="1" cellpadding="8" style="border-collapse: collapse; width: 100%; margin-top: 20px; font-size: 9px;">
        <thead>
            <tr style="background-color: #f2f2f2;">
                <th style="font-size: 8px;">Order</th>
                <th style="font-size: 8px;">Queue Name</th>
                <th style="font-size: 8px;">Rule</th>
            </tr>
        </thead>
        <tbody>
            {% for rule in all_rules %}
            <tr class="rule-row" data-order="{{ rule.rule_order }}">
                <td>{{ rule.rule_order }}</td>
                <td>{{ rule.queue_name }}</td>
                <td style="font-size: 9px;">{{ rule.rule }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
  </div>

  <!-- Füge diesen Code innerhalb des body-Tags hinzu, vor dem cytoscape div -->
  <button id="scrollToGraphBtn" title="Zum Graph scrollen" style="bottom: 80px;">
    <svg width="24" height="24" viewBox="0 0 24 24" style="vertical-align: middle;">
      <path fill="currentColor" d="M8 11h3v10h2V11h3l-4-4-4 4M4 3v2h16V3H4z"/>
    </svg>
  </button>
  <button id="scrollToMessageBtn" title="Zum Nachrichtenfeld scrollen" style="bottom: 80px;">
    <svg width="24" height="24" viewBox="0 0 24 24" style="vertical-align: middle;">
      <path fill="currentColor" d="M4 3h18v2H4V3m0 4h12v2H4V7m0 4h18v2H4v-2m0 4h12v2H4v-2m0 4h18v2H4v-2"/>
    </svg>
  </button>
  <button id="scrollToBottomBtn" title="Zum Seitenende scrollen" style="bottom: 140px;">
    <svg width="24" height="24" viewBox="0 0 24 24" style="vertical-align: middle;">
      <path fill="currentColor" d="M16 13h-3V3h-2v10H8l4 4 4-4m1 8H7v2h10v-2z"/>
    </svg>
  </button>

  <script src="{{ url_for('static', filename='js/cytoscape.min.js') }}"></script>
  <script>
    window.IGR_DATA = {
      nodes: {{ nodes|tojson }},
      edges: {{ edges|tojson }},
      routingRules: {{ routing_rules|tojson }},
      reverseRoutingRules: {{ reverse_routing_rules|tojson }},
      clearMessageUrl: {{ url_for('admin.admin_clear_message')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
